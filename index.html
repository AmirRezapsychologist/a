<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <title>Cognitive WebXR - Hand Tracking & CSV Export</title>
  <!-- کتابخانه استاندارد A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

  <a-scene background="color: #0f1117">
    
    <!-- نورپردازی -->
    <a-entity light="type: ambient; color: #BBB"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 2 1"></a-entity>

    <!-- پنل اطلاعات و وضعیت آزمون -->
    <a-text id="scoreboard" 
            value="Pinch button below or use controller to Start" 
            position="0 2.1 -2" 
            align="center" 
            width="3.8" 
            color="#FFFFFF">
    </a-text>

    <!-- دکمه سه‌بعدی شروع آزمون -->
    <a-entity id="start-btn" position="0 1.6 -1.8" class="clickable">
      <a-box width="0.7" height="0.25" depth="0.05" color="#0077FF"></a-box>
      <a-text value="START TEST" align="center" position="0 0 0.03" scale="0.5 0.5 0.5" color="#FFF"></a-text>
    </a-entity>

    <!-- محرک آزمون (Go/No-Go Sphere) -->
    <a-sphere id="stimulus" position="0 1.5 -2" radius="0.22" visible="false" class="clickable"></a-sphere>

    <!-- دکمه سه‌بعدی دانلود CSV (در پایان آزمون ظاهر می‌شود) -->
    <a-entity id="export-btn" position="0 1.2 -1.8" visible="false" class="clickable">
      <a-box width="0.9" height="0.25" depth="0.05" color="#00AA55"></a-box>
      <a-text value="DOWNLOAD CSV" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#FFF"></a-text>
    </a-entity>

    <!-- سیستم ریگ دوربین، کنترلرها و ردیابی دست -->
    <a-entity id="rig" position="0 0 0">
      <a-camera position="0 1.6 0">
        <!-- ری‌کستر نگاه (Gaze Fallback) -->
        <a-cursor fuse="false" raycaster="objects: .clickable" color="#FFFF00" scale="0.5 0.5 0.5"></a-cursor>
      </a-camera>
      
      <!-- کنترلرهای فیزیکی سنتی (در صورت استفاده از دسته‌ها) -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #00FFCC; lineOpacity: 0.5"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #00FFCC; lineOpacity: 0.5"></a-entity>

      <!-- ردیابی دست راست (Hand Tracking) -->
      <a-entity hand-tracking-controls="hand: right; modelStyle: mesh"
                raycaster="objects: .clickable; showLine: true; lineColor: #FFDD00; origin: 0 0 0; direction: 0 0 -1">
      </a-entity>

      <!-- ردیابی دست چپ (Hand Tracking) -->
      <a-entity hand-tracking-controls="hand: left; modelStyle: mesh"
                raycaster="objects: .clickable; showLine: true; lineColor: #FFDD00; origin: 0 0 0; direction: 0 0 -1">
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    let isTaskActive = false;
    let stimulusType = null;
    let stimulusStartTime = 0;
    let timeoutId = null;
    let trialCount = 0;
    const maxTrials = 12;
    const resultsLog = [];

    const stimulusEl = document.getElementById('stimulus');
    const scoreboard = document.getElementById('scoreboard');
    const startBtn = document.getElementById('start-btn');
    const exportBtn = document.getElementById('export-btn');

    // لیسنر دکمه شروع
    startBtn.addEventListener('click', () => {
      if (!isTaskActive) {
        startBtn.setAttribute('visible', 'false');
        startBtn.classList.remove('clickable');
        exportBtn.setAttribute('visible', 'false');
        exportBtn.classList.remove('clickable');
        startTask();
      }
    });

    // پاسخ کاربر به محرک
    stimulusEl.addEventListener('click', () => {
      if (!isTaskActive) return;
      handleResponse();
    });

    // لیسنر خروجی CSV
    exportBtn.addEventListener('click', () => {
      exportToCSV();
    });

    function startTask() {
      isTaskActive = true;
      trialCount = 0;
      resultsLog.length = 0;
      scoreboard.setAttribute('value', 'Task Running: Pinch GREEN, Ignore RED');
      runTrial();
    }

    function runTrial() {
      if (trialCount >= maxTrials) {
        endTask();
        return;
      }

      trialCount++;
      stimulusEl.setAttribute('visible', 'false');

      // وقفه بین محرک‌ها (۱.۲ تا ۲.۲ ثانیه)
      const isi = Math.floor(Math.random() * 1000) + 1200;

      setTimeout(() => {
        // ۷۵ درصد احتمال Go و ۲۵ درصد No-Go
        stimulusType = Math.random() < 0.75 ? 'go' : 'nogo';

        // توزیع تصادفی محرک در میدان دید
        const posX = (Math.random() - 0.5) * 1.4;
        const posY = 1.3 + Math.random() * 0.5;
        stimulusEl.setAttribute('position', `${posX} ${posY} -2`);

        stimulusEl.setAttribute('color', stimulusType === 'go' ? '#00FF66' : '#FF2222');
        stimulusEl.setAttribute('visible', 'true');

        stimulusStartTime = performance.now();

        // پنجره پاسخ زمانی (۱ ثانیه)
        timeoutId = setTimeout(() => {
          handleOmission();
        }, 1000);

      }, isi);
    }

    function handleResponse() {
      clearTimeout(timeoutId);
      const reactionTime = Math.round(performance.now() - stimulusStartTime);
      stimulusEl.setAttribute('visible', 'false');

      if (stimulusType === 'go') {
        resultsLog.push({
          trial: trialCount,
          type: 'Go',
          response: 'Hit',
          rt_ms: reactionTime,
          error_type: 'None'
        });
        scoreboard.setAttribute('value', `Correct! RT: ${reactionTime} ms`);
      } else {
        resultsLog.push({
          trial: trialCount,
          type: 'No-Go',
          response: 'False Alarm',
          rt_ms: reactionTime,
          error_type: 'Commission'
        });
        scoreboard.setAttribute('value', 'Commission Error! Red was pressed');
      }

      runTrial();
    }

    function handleOmission() {
      stimulusEl.setAttribute('visible', 'false');

      if (stimulusType === 'go') {
        resultsLog.push({
          trial: trialCount,
          type: 'Go',
          response: 'Miss',
          rt_ms: 'NA',
          error_type: 'Omission'
        });
        scoreboard.setAttribute('value', 'Missed Target (Omission)');
      } else {
        resultsLog.push({
          trial: trialCount,
          type: 'No-Go',
          response: 'Correct Rejection',
          rt_ms: 'NA',
          error_type: 'None'
        });
        scoreboard.setAttribute('value', 'Successful Inhibition!');
      }

      runTrial();
    }

    function endTask() {
      isTaskActive = false;
      stimulusEl.setAttribute('visible', 'false');

      const hits = resultsLog.filter(r => r.type === 'Go' && r.response === 'Hit');
      const meanRT = hits.length > 0 
        ? Math.round(hits.reduce((sum, r) => sum + r.rt_ms, 0) / hits.length) 
        : 0;
      const commErrors = resultsLog.filter(r => r.error_type === 'Commission').length;
      const omissErrors = resultsLog.filter(r => r.error_type === 'Omission').length;

      scoreboard.setAttribute('value', 
        `Test Completed!\nMean RT: ${meanRT} ms | Comm Errors: ${commErrors} | Omiss Errors: ${omissErrors}`
      );

      // فعال‌سازی دکمه دانلود و دکمه شروع مجدد
      exportBtn.setAttribute('visible', 'true');
      exportBtn.classList.add('clickable');

      startBtn.setAttribute('visible', 'true');
      startBtn.classList.add('clickable');
      startBtn.querySelector('a-text').setAttribute('value', 'RESTART');
    }

    // تولید و دانلود فایل CSV در مرورگر هدست
    function exportToCSV() {
      if (resultsLog.length === 0) return;

      const headers = ['Trial', 'Stimulus_Type', 'Response', 'ReactionTime_ms', 'Error_Type'];
      const csvRows = [headers.join(',')];

      resultsLog.forEach(row => {
        csvRows.push([
          row.trial,
          row.type,
          row.response,
          row.rt_ms,
          row.error_type
        ].join(','));
      });

      const csvContent = '\uFEFF' + csvRows.join('\n'); // افزودن BOM برای سازگاری با اکسل و متون
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.setAttribute('download', `cognitive_test_${Date.now()}.csv`);
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
