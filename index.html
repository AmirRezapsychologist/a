<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <title>Cognitive Task - Hand Pinch Fixed</title>
  <!-- کتابخانه استاندارد A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    // سیستم جامع تعامل دست: نیشگون لیزری + لمس فیزیکی مستقیم (Poke)
    AFRAME.registerComponent('universal-vr-interaction', {
      init: function () {
        const sceneEl = this.el.sceneEl;
        this.activeIntersections = new Set();

        // 1. شنود رسمی وب‌اکس‌آر روی سشن مرورگر کوئست
        sceneEl.addEventListener('enter-vr', () => {
          const session = sceneEl.xrSession;
          if (session) {
            session.addEventListener('select', (evt) => {
              this.triggerFocusedClick();
            });
            session.addEventListener('selectstart', () => {
              this.triggerFocusedClick();
            });
          }
        });

        // 2. شنود ایونت‌های دست و کنترلر در A-Frame
        const fireAction = () => this.triggerFocusedClick();
        this.el.addEventListener('pinchstarted', fireAction);
        this.el.addEventListener('triggerdown', fireAction);
        this.el.addEventListener('select', fireAction);

        // رصد اجسامی که اشعه زرد هم‌اکنون روی آن‌ها قرار دارد
        this.el.addEventListener('raycaster-intersection', (evt) => {
          if (evt.detail.els) {
            evt.detail.els.forEach(el => this.activeIntersections.add(el));
          }
        });
        this.el.addEventListener('raycaster-intersection-cleared', (evt) => {
          if (evt.detail.clearedEls) {
            evt.detail.clearedEls.forEach(el => this.activeIntersections.delete(el));
          }
        });
      },

      // اجرای کلیک روی المان نشانه‌رفته با اشعه
      triggerFocusedClick: function () {
        let clicked = false;
        
        // اگر اشعه روی جسمی باشد
        this.activeIntersections.forEach(targetEl => {
          if (targetEl && targetEl.classList.contains('clickable')) {
            targetEl.emit('click', null, true);
            this.playClickAudio();
            clicked = true;
          }
        });

        // پشتیبانی مستقیم از کامپوننت raycaster داخلی
        if (!clicked && this.el.components.raycaster) {
          const intersected = this.el.components.raycaster.intersectedEls;
          if (intersected && intersected.length > 0) {
            const target = intersected[0];
            target.emit('click', null, true);
            this.playClickAudio();
          }
        }
      },

      // امکان لمس فیزیکی مستقیم دکمه با نوک دست در دنیای واقعی
      tick: function () {
        const handPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(handPos);

        const clickables = document.querySelectorAll('.clickable');
        clickables.forEach(el => {
          if (!el.getAttribute('visible') && el.parentElement && !el.parentElement.getAttribute('visible')) return;
          
          const objPos = new THREE.Vector3();
          el.object3D.getWorldPosition(objPos);
          
          // اگر دست به کمتر از 18 سانتی‌متری دکمه رسید (لمس فیزیکی)
          if (handPos.distanceTo(objPos) < 0.18) {
            if (!el.__isTouched) {
              el.__isTouched = true;
              el.emit('click', null, true);
              this.playClickAudio();
              setTimeout(() => { el.__isTouched = false; }, 800);
            }
          }
        });
      },

      playClickAudio: function () {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } catch (e) {}
      }
    });

    // افکت شناوری و بازخورد لمسی (Hover Effect)
    AFRAME.registerComponent('interactive-hover', {
      schema: {
        hoverColor: { type: 'color', default: '#38BDF8' },
        defaultColor: { type: 'color', default: '#0284C7' }
      },
      init: function () {
        const el = this.el;
        el.addEventListener('raycaster-intersected', () => {
          el.setAttribute('color', this.data.hoverColor);
          el.setAttribute('scale', '1.08 1.08 1.08');
        });
        el.addEventListener('raycaster-intersected-cleared', () => {
          el.setAttribute('color', this.data.defaultColor);
          el.setAttribute('scale', '1 1 1');
        });
      }
    });
  </script>
</head>
<body>

  <a-scene 
    background="color: #0b1120"
    webxr="optionalFeatures: hand-tracking, hit-test, local-floor; referenceSpaceType: local-floor">

    <!-- نورپردازی سه بعدی محیط -->
    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #E0F2FE; intensity: 0.8" position="0 3 2"></a-entity>

    <!-- نمایشگر وضعیت بالای دکمه -->
    <a-text id="status-title" 
            value="انگشت اشاره و شست را به هم بزنید (Pinch)" 
            position="0 2.2 -1.8" 
            align="center" 
            width="3.5" 
            color="#E2E8F0">
    </a-text>

    <!-- دکمه شروع آزمون (START) -->
    <a-entity id="start-wrapper" position="0 1.5 -1.8">
      <a-box id="start-btn" 
             class="clickable" 
             width="0.9" height="0.3" depth="0.06" 
             color="#0284C7" 
             interactive-hover="defaultColor: #0284C7; hoverColor: #38BDF8">
        <a-text value="START TEST" align="center" position="0 0 0.04" scale="0.6 0.6 0.6" color="#FFFFFF"></a-text>
      </a-box>
    </a-entity>

    <!-- محرک آزمون شناختی (Go / No-Go) -->
    <a-sphere id="stimulus-sphere" 
              class="clickable" 
              position="0 1.5 -2.2" 
              radius="0.22" 
              visible="false"
              interactive-hover="defaultColor: #10B981; hoverColor: #34D399">
    </a-sphere>

    <!-- دکمه دانلود داده‌ها (CSV) -->
    <a-entity id="export-wrapper" position="0 1.1 -1.8" visible="false">
      <a-box id="export-btn" 
             class="clickable" 
             width="0.9" height="0.28" depth="0.06" 
             color="#059669"
             interactive-hover="defaultColor: #059669; hoverColor: #10B981">
        <a-text value="DOWNLOAD CSV" align="center" position="0 0 0.04" scale="0.5 0.5 0.5" color="#FFFFFF"></a-text>
      </a-box>
    </a-entity>

    <!-- سیستم ردیابی دست‌ها، کنترلرها و دوربین -->
    <a-entity id="rig">
      <a-camera position="0 1.6 0">
        <!-- کرسر کمکی نگاه: در صورت نگاه به دکمه و نیشگون هم فعال می‌شود -->
        <a-cursor fuse="false" raycaster="objects: .clickable" color="#FACC15" scale="0.3 0.3 0.3"></a-cursor>
      </a-camera>

      <!-- دست راست مجهز به ردیابی دست و اشعه همگام با نیشگون و لمس -->
      <a-entity id="rightHand"
                hand-tracking-controls="hand: right; modelStyle: mesh"
                raycaster="objects: .clickable; showLine: true; lineColor: #FACC15; far: 6; interval: 50"
                cursor="downEvents: pinchstarted, selectstart, triggerdown; upEvents: pinchended, selectend, triggerup"
                universal-vr-interaction>
      </a-entity>

      <!-- دست چپ -->
      <a-entity id="leftHand"
                hand-tracking-controls="hand: left; modelStyle: mesh"
                raycaster="objects: .clickable; showLine: true; lineColor: #FACC15; far: 6; interval: 50"
                cursor="downEvents: pinchstarted, selectstart, triggerdown; upEvents: pinchended, selectend, triggerup"
                universal-vr-interaction>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    let isTaskRunning = false;
    let stimulusType = null;
    let stimulusShownTime = 0;
    let timeoutTimer = null;
    let currentTrial = 0;
    const maxTrials = 10;
    const sessionRecords = [];

    const stimulusEl = document.getElementById('stimulus-sphere');
    const statusText = document.getElementById('status-title');
    const startWrapper = document.getElementById('start-wrapper');
    const startBtn = document.getElementById('start-btn');
    const exportWrapper = document.getElementById('export-wrapper');
    const exportBtn = document.getElementById('export-btn');

    // کلیک روی دکمه شروع (پشتیبانی همزمان از click، touch و pinch)
    function handleStartClick() {
      if (isTaskRunning) return;
      startTask();
    }
    startBtn.addEventListener('click', handleStartClick);

    // پاسخ کاربر به محرک هدف
    function handleStimulusClick() {
      if (!isTaskRunning || !stimulusEl.getAttribute('visible')) return;
      handleUserHit();
    }
    stimulusEl.addEventListener('click', handleStimulusClick);

    // دانلود خروجی آزمون
    exportBtn.addEventListener('click', () => {
      exportCSV();
    });

    function startTask() {
      isTaskRunning = true;
      currentTrial = 0;
      sessionRecords.length = 0;

      startWrapper.setAttribute('visible', 'false');
      startBtn.classList.remove('clickable');
      exportWrapper.setAttribute('visible', 'false');
      exportBtn.classList.remove('clickable');

      statusText.setAttribute('value', 'تست آغاز شد: روی سبز Pinch کنید، به قرمز واکنش ندهید');
      nextTrial();
    }

    function nextTrial() {
      if (currentTrial >= maxTrials) {
        endTask();
        return;
      }

      currentTrial++;
      stimulusEl.setAttribute('visible', 'false');

      // وقفه تصادفی بین ۱ تا ۲ ثانیه
      const isi = Math.floor(Math.random() * 1000) + 1000;

      setTimeout(() => {
        stimulusType = Math.random() < 0.7 ? 'Go' : 'NoGo';

        // توزیع تصادفی موقعیت
        const xPos = (Math.random() - 0.5) * 1.3;
        const yPos = 1.3 + Math.random() * 0.4;
        stimulusEl.setAttribute('position', `${xPos} ${yPos} -2.2`);

        const stimColor = stimulusType === 'Go' ? '#10B981' : '#EF4444';
        stimulusEl.setAttribute('color', stimColor);
        stimulusEl.setAttribute('interactive-hover', `defaultColor: ${stimColor}; hoverColor: #FFFFFF`);
        stimulusEl.setAttribute('visible', 'true');

        stimulusShownTime = performance.now();

        // مهلت پاسخ‌دهی ۱.۱ ثانیه
        timeoutTimer = setTimeout(() => {
          handleOmission();
        }, 1100);

      }, isi);
    }

    function handleUserHit() {
      clearTimeout(timeoutTimer);
      const rt = Math.round(performance.now() - stimulusShownTime);
      stimulusEl.setAttribute('visible', 'false');

      if (stimulusType === 'Go') {
        sessionRecords.push({ trial: currentTrial, type: 'Go', response: 'Hit', rt: rt, error: 'None' });
        statusText.setAttribute('value', `پاسخ صحیح! زمان: ${rt} میلی‌ثانیه`);
      } else {
        sessionRecords.push({ trial: currentTrial, type: 'NoGo', response: 'FalseAlarm', rt: rt, error: 'Commission' });
        statusText.setAttribute('value', 'خطا! به محرک قرمز نباید واکنش داد.');
      }

      nextTrial();
    }

    function handleOmission() {
      stimulusEl.setAttribute('visible', 'false');

      if (stimulusType === 'Go') {
        sessionRecords.push({ trial: currentTrial, type: 'Go', response: 'Miss', rt: 'NA', error: 'Omission' });
        statusText.setAttribute('value', 'هدف از دست رفت (خطای حذف)');
      } else {
        sessionRecords.push({ trial: currentTrial, type: 'NoGo', response: 'CorrectReject', rt: 'NA', error: 'None' });
        statusText.setAttribute('value', 'مهار موفقیت‌آمیز');
      }

      nextTrial();
    }

    function endTask() {
      isTaskRunning = false;
      stimulusEl.setAttribute('visible', 'false');

      const hits = sessionRecords.filter(r => r.type === 'Go' && r.response === 'Hit');
      const meanRT = hits.length > 0 ? Math.round(hits.reduce((s, r) => s + r.rt, 0) / hits.length) : 0;
      const commissionCount = sessionRecords.filter(r => r.error === 'Commission').length;

      statusText.setAttribute('value', `پایان آزمون!\nمیانگین زمان: ${meanRT}ms | خطای ارتکاب: ${commissionCount}`);

      startWrapper.setAttribute('visible', 'true');
      startBtn.classList.add('clickable');
      startBtn.querySelector('a-text').setAttribute('value', 'RETRY');

      exportWrapper.setAttribute('visible', 'true');
      exportBtn.classList.add('clickable');
    }

    function exportCSV() {
      if (sessionRecords.length === 0) return;

      const header = ['Trial,Stimulus_Type,Response,ReactionTime_ms,Error_Type'];
      const rows = sessionRecords.map(r => `${r.trial},${r.type},${r.response},${r.rt},${r.error}`);
      const csv = '\uFEFF' + header.concat(rows).join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `vr_cognitive_session_${Date.now()}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
